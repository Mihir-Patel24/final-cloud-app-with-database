<!DOCTYPE html>
<html><head><title>Login</title><link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'></head>
<body>{% include "onlinecourse/nav_bootstrap.html" %}
<div class='container mt-5' style='max-width:400px'>
<h2>Login</h2>{% if message %}<div class='alert alert-danger'>{{ message }}</div>{% endif %}
<form method='post'><input type='hidden' name='csrfmiddlewaretoken' value='{{ csrf_token }}'>
<div class='mb-3'><label>Username</label><input type='text' name='username' class='form-control'></div>
<div class='mb-3'><label>Password</label><input type='password' name='psw' class='form-control'></div>
<button type='submit' class='btn btn-primary w-100'>Login</button></form>
<p class='mt-3'>No account? <a href='/onlinecourse/registration/'>Register</a></p>
</div></body></html>
