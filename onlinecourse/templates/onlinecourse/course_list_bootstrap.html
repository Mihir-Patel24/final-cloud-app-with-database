{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Courses</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
{% include "onlinecourse/nav_bootstrap.html" %}
<div class="container mt-4">
    <h1>Available Courses</h1>
    <div class="row">
        {% for course in object_list %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                {% if course.image %}
                <img src="{{ course.image.url }}" class="card-img-top" alt="{{ course.name }}" style="height:200px;object-fit:cover;">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ course.name }}</h5>
                    <p class="card-text">{{ course.description }}</p>
                </div>
                <div class="card-footer">
                    <a href="{% url 'onlinecourse:course_details' course.id %}" class="btn btn-primary">View Course</a>
                    <a href="{% url 'onlinecourse:enroll' course.id %}" class="btn btn-success ms-2">Enroll</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
