{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">🎓 Online Courses</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
            <span class="navbar-text text-white me-3">Hello, {{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:logout' %}">Logout</a>
            {% else %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'onlinecourse:login' %}">Login</a>
            <a class="btn btn-light btn-sm" href="{% url 'onlinecourse:registration' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
